<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications – Imaz</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/settings.css">
  <style>
    body { overflow-y: auto; height: auto; min-height: 100vh; }

    .notif-list { padding: 8px 16px 40px; }

    .notif-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 80px 24px;
      color: var(--text-muted);
    }

    .notif-empty-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .notif-empty-icon svg { width: 24px; height: 24px; }
    .notif-empty p { font-size: 14px; text-align: center; margin: 0; }

    .notif-group-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 16px 2px 6px;
    }

    .notif-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 4px;
    }

    .notif-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      transition: background 0.12s;
    }

    .notif-row:first-child { border-top: none; }
    .notif-row:hover { background: var(--surface-2); }
    .notif-row.unread { background: var(--accent-dim); }
    .notif-row.unread:hover { filter: brightness(0.97); }

    .notif-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--accent-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .notif-icon svg { width: 18px; height: 18px; color: var(--accent); }

    .notif-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .notif-title { font-size: 14px; font-weight: 600; line-height: 1.3; }
    .notif-sub   { font-size: 12px; color: var(--text-muted); }

    .notif-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      margin-top: 6px;
    }

    /* ── Invitation card ── */
    .invite-card {
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 8px;
    }

    .invite-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .invite-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--accent-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .invite-icon svg { width: 18px; height: 18px; color: var(--accent); }

    .invite-body  { flex: 1; min-width: 0; }
    .invite-title { font-size: 14px; font-weight: 600; line-height: 1.4; }
    .invite-sub   { font-size: 12px; color: var(--text-muted); margin-top: 3px; }

    .invite-actions { display: flex; gap: 8px; }

    .invite-actions .btn-secondary,
    .invite-actions .btn-primary { flex: 1; font-size: 13px; padding: 9px 12px; }

    .invite-done {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      padding: 4px 0;
    }
  </style>
</head>
<body>

  <header>
    <button class="icon-btn" onclick="history.back()"><i data-lucide="arrow-left"></i></button>
    <div class="header-title">Notifications</div>
    <div style="width:38px"></div>
  </header>

  <div class="notif-list" id="notif-list">
    <p style="padding:24px;color:var(--text-muted);text-align:center">Chargement…</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/core.js"></script>
  <script>
    checkAuth();
    lucide.createIcons();

    const NOTIF_KEY = 'imaz_notifications';
    const listEl    = document.getElementById('notif-list');

    function getLocalNotifs() {
      return JSON.parse(localStorage.getItem(NOTIF_KEY) || '[]');
    }

    function markAllLocalRead() {
      const notifs = getLocalNotifs().map(n => ({ ...n, read: true }));
      localStorage.setItem(NOTIF_KEY, JSON.stringify(notifs));
    }

    // ── INVITATION CARD ────────────────────────────────────
    function renderInviteCard(inv) {
      const senderName = inv.sender_name || inv.sender_username || 'Quelqu\'un';
      const dateStr    = formatLong(inv.date_key);
      const exoCount   = (inv.session_data?.exercises || []).length;
      const exoLabel   = exoCount > 0
        ? `${exoCount} exercice${exoCount > 1 ? 's' : ''}`
        : 'Séance planifiée';

      const card = document.createElement('div');
      card.className = 'invite-card';
      card.innerHTML = `
        <div class="invite-header">
          <div class="invite-icon"><i data-lucide="send"></i></div>
          <div class="invite-body">
            <div class="invite-title"><strong>${senderName}</strong> t'a envoyé une séance</div>
            <div class="invite-sub">Pour le ${dateStr} · ${exoLabel}</div>
          </div>
        </div>
        <div class="invite-actions" id="inv-actions-${inv.id}">
          <button class="btn-secondary btn-refuse">Refuser</button>
          <button class="btn-primary btn-accept">
            <i data-lucide="check"></i> Accepter
          </button>
        </div>`;

      card.querySelector('.btn-refuse').addEventListener('click', async () => {
        card.querySelector(`#inv-actions-${inv.id}`).innerHTML =
          '<p class="invite-done">Séance refusée</p>';
        await refuseInvitation(inv.id);
      });

      card.querySelector('.btn-accept').addEventListener('click', async () => {
        const actionsEl = card.querySelector(`#inv-actions-${inv.id}`);
        actionsEl.innerHTML = '<p class="invite-done">…</p>';
        const { error } = await acceptInvitation(inv.id, inv.date_key, inv.session_data);
        actionsEl.innerHTML = error
          ? '<p class="invite-done" style="color:#e53e3e">Erreur. Réessaie.</p>'
          : '<p class="invite-done" style="color:#48c78e">✓ Séance ajoutée à ton calendrier</p>';
        if (error) {
          // allow retry
          setTimeout(() => {
            actionsEl.innerHTML = `
              <button class="btn-secondary btn-refuse">Refuser</button>
              <button class="btn-primary btn-accept"><i data-lucide="check"></i> Accepter</button>`;
            // re-attach listeners by re-rendering — simplest: re-call parent
            lucide.createIcons();
          }, 2000);
        }
      });

      return card;
    }

    // ── LOCAL NOTIFICATIONS ────────────────────────────────
    function renderLocalNotifs(notifs) {
      if (notifs.length === 0) return;
      const today     = dateToKey(new Date());
      const yesterday = dateToKey(new Date(Date.now() - 86400000));
      const groups    = {};

      notifs.slice().reverse().forEach(n => {
        const day   = n.date ? n.date.slice(0, 10) : today;
        const label = day === today     ? "Aujourd'hui"
                    : day === yesterday ? 'Hier'
                    : formatShort(day);
        if (!groups[label]) groups[label] = [];
        groups[label].push(n);
      });

      Object.entries(groups).forEach(([label, items]) => {
        const labelEl = document.createElement('div');
        labelEl.className = 'notif-group-label';
        labelEl.textContent = label;
        listEl.appendChild(labelEl);

        const card = document.createElement('div');
        card.className = 'notif-card';
        items.forEach(n => {
          const icon  = n.icon || 'bell';
          const unread = !n.read;
          const row   = document.createElement('div');
          row.className = 'notif-row' + (unread ? ' unread' : '');
          row.innerHTML = `
            <div class="notif-icon"><i data-lucide="${icon}"></i></div>
            <div class="notif-body">
              <span class="notif-title">${n.title}</span>
              <span class="notif-sub">${n.message || ''}</span>
            </div>
            ${unread ? '<div class="notif-dot"></div>' : ''}`;
          card.appendChild(row);
        });
        listEl.appendChild(card);
      });
    }

    // ── MAIN RENDER ────────────────────────────────────────
    async function render() {
      listEl.innerHTML = '';
      const invitations = await loadPendingInvitations();
      const localNotifs = getLocalNotifs();

      if (invitations.length === 0 && localNotifs.length === 0) {
        listEl.innerHTML = `
          <div class="notif-empty">
            <div class="notif-empty-icon"><i data-lucide="bell-off"></i></div>
            <p>Aucune notification pour l'instant.</p>
          </div>`;
        lucide.createIcons();
        return;
      }

      if (invitations.length > 0) {
        const label = document.createElement('div');
        label.className = 'notif-group-label';
        label.textContent = 'Invitations';
        listEl.appendChild(label);
        invitations.forEach(inv => listEl.appendChild(renderInviteCard(inv)));
      }

      renderLocalNotifs(localNotifs);
      lucide.createIcons();
      markAllLocalRead();
    }

    render();
  </script>

</body>
</html>
