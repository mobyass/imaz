<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imaz</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/form.css">
  <link rel="stylesheet" href="css/timer.css">
</head>
<body>

  <header>
    <div class="logo">Im<span>az</span></div>
    <button class="icon-btn"><i data-lucide="bell"></i></button>
  </header>

  <!-- PAGE ACCUEIL -->
  <div class="page active" id="page-home">

    <section class="calendar-section">
      <div class="calendar-nav">
        <button class="cal-arrow" id="prev-week"><i data-lucide="chevron-left"></i></button>
        <span id="month-year"></span>
        <button class="cal-arrow" id="next-week"><i data-lucide="chevron-right"></i></button>
      </div>
      <div class="week-strip" id="week-strip"></div>
    </section>

    <section class="section">
      <div class="section-header">
        <h2>Séance du jour</h2>
      </div>
      <div class="seance-today">
        <div class="empty-icon"><i data-lucide="dumbbell"></i></div>
        <p>Aucune séance prévue aujourd'hui</p>
        <button class="btn-primary"><i data-lucide="plus"></i> Créer une séance</button>
      </div>
    </section>

    <section class="section section-seances-avenir">
      <div class="section-header">
        <h2>Séances à venir</h2>
        <button class="btn-schedule" id="btn-schedule">
          <i data-lucide="calendar-plus"></i> Programmer
        </button>
      </div>
      <div class="seances-list">
        <p class="empty-state">Aucune séance à venir</p>
      </div>
    </section>

  </div>

  <!-- NAV BAS -->
  <nav class="bottom-nav">
    <button class="nav-btn active">
      <i data-lucide="home"></i><span>Accueil</span>
    </button>
    <button class="nav-btn">
      <i data-lucide="user"></i><span>Profil</span>
    </button>
  </nav>

  <!-- TIMER MODAL -->
  <div class="timer-overlay" id="rest-timer-overlay">
    <div class="timer-modal">
      <div class="timer-title">Récupération</div>
      <div class="timer-ring-wrap">
        <svg class="timer-svg" viewBox="0 0 120 120">
          <circle class="timer-track"    cx="60" cy="60" r="54"/>
          <circle class="timer-progress" cx="60" cy="60" r="54" id="timer-progress"/>
        </svg>
        <div class="timer-center">
          <span class="timer-countdown" id="rest-timer-countdown">–</span>
        </div>
      </div>
      <div class="timer-actions">
        <button class="timer-btn-stop"  id="rest-timer-stop">Arrêter</button>
        <button class="timer-btn-pause" id="rest-timer-pause">Pause</button>
      </div>
    </div>
  </div>

  <!-- MODAL NOUVELLE SÉANCE -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h3>Nouvelle séance</h3>
          <span class="modal-date-label" id="modal-date-label"></span>
        </div>
        <button class="modal-close" id="modal-close"><i data-lucide="x"></i></button>
      </div>

      <div id="modal-exercises"></div>

      <button class="btn-add-exo" id="btn-add-exo">
        <i data-lucide="plus"></i> Ajouter un exercice
      </button>

      <p class="modal-error" id="modal-save-error" hidden></p>

      <button class="btn-danger" id="btn-delete-session" hidden>
        <i data-lucide="trash-2"></i> Supprimer la séance
      </button>

      <div class="modal-footer">
        <button class="btn-secondary" id="btn-cancel">Annuler</button>
        <button class="btn-primary" id="btn-save">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- MODAL VUE SÉANCE (lecture seule) -->
  <div class="modal-overlay" id="session-view-overlay">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h3>Séance du jour</h3>
          <span class="modal-date-label" id="session-view-date"></span>
        </div>
        <button class="modal-close" id="session-view-close"><i data-lucide="x"></i></button>
      </div>
      <div id="session-view-content"></div>
    </div>
  </div>

  <!-- MODAL CONFIRMATION SUPPRESSION -->
  <div class="modal-overlay" id="confirm-delete-overlay">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h3>Supprimer la séance ?</h3>
          <span class="modal-date-label" id="confirm-delete-date"></span>
        </div>
      </div>
      <p class="confirm-text">Cette action est irréversible. Tous les exercices seront supprimés.</p>
      <div class="modal-footer">
        <button class="btn-secondary" id="confirm-delete-cancel">Annuler</button>
        <button class="btn-danger-confirm" id="confirm-delete-ok">
          <i data-lucide="trash-2"></i> Supprimer
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL PROGRAMMER SÉANCE -->
  <div class="modal-overlay" id="schedule-overlay">
    <div class="modal">
      <div class="modal-header">
        <div><h3>Programmer une séance</h3></div>
        <button class="modal-close" id="schedule-close"><i data-lucide="x"></i></button>
      </div>
      <div class="sched-cal">
        <div class="sched-cal-nav">
          <button class="sched-cal-arrow" id="sched-prev"><i data-lucide="chevron-left"></i></button>
          <span class="sched-cal-label" id="sched-month-label"></span>
          <button class="sched-cal-arrow" id="sched-next"><i data-lucide="chevron-right"></i></button>
        </div>
        <div class="sched-cal-weekdays">
          <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
        </div>
        <div class="sched-cal-grid" id="sched-cal-grid"></div>
      </div>
      <p class="modal-error" id="schedule-error" hidden></p>
      <div class="modal-footer schedule-footer">
        <button class="btn-secondary" id="schedule-cancel">Annuler</button>
        <button class="btn-primary" id="schedule-confirm">
          <i data-lucide="calendar-plus"></i> Programmer
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/core.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/app.js"></script>
  <script src="js/timer.js"></script>
  <script>checkAuth();</script>

</body>
</html>
