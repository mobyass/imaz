<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://*.supabase.co;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    connect-src 'self' https://*.supabase.co https://*.supabase.io wss://*.supabase.co;
    img-src 'self' data: blob: https://*.supabase.co https://*.supabase.io;
    font-src 'self' data: https://fonts.gstatic.com;
    frame-src 'none';
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  ">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Athlètes – ARMAZ</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/settings.css">
  <style>
    body { overflow-y: auto; height: auto; min-height: 100vh; }

    .prat-list { padding: 8px 16px 40px; }

    .prat-section-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 12px 2px 8px;
    }

    .prat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .prat-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-top: 1px solid var(--border);
    }
    .prat-row:first-child { border-top: none; }

    .prat-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--accent-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
      background-size: cover;
      background-position: center;
    }

    .prat-info { flex: 1; min-width: 0; }
    .prat-name { font-size: 14px; font-weight: 600; }
    .prat-username { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .prat-actions {
      display: flex;
      gap: 8px;
      padding: 0 16px 12px 70px;
      border-top: none;
    }
    .prat-action-btn {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-dim);
      border: none;
      border-radius: 8px;
      padding: 5px 12px;
      cursor: pointer;
    }
    .prat-remove-btn {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
    }
    .prat-remove-btn:hover { color: #e53e3e; background: rgba(229,62,62,0.08); }

    .prat-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 80px 24px;
      color: var(--text-muted);
    }
    .prat-empty-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .prat-empty-icon svg { width: 26px; height: 26px; }
    .prat-empty p { font-size: 14px; text-align: center; margin: 0; }

    /* Modale */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 1100; opacity: 0; pointer-events: none; transition: opacity 0.15s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px; width: calc(100% - 32px);
      max-width: 340px; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .modal-header h3 { font-size: 16px; font-weight: 700; margin: 0; }
    .modal-close { background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 4px; }
    .modal-close svg { width: 18px; height: 18px; }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

  <header>
    <button class="icon-btn" onclick="history.back()"><i data-lucide="arrow-left"></i></button>
    <div class="header-title">Athlètes</div>
    <div style="width:38px"></div>
  </header>

  <div class="prat-list" id="prat-list">
    <p style="padding:24px;color:var(--text-muted);text-align:center">Chargement…</p>
  </div>

  <!-- CONFIRM RETIRER ATHLÈTE -->
  <div class="modal-overlay" id="confirm-remove-overlay" style="z-index:1100">
    <div class="modal" style="max-width:340px">
      <div class="modal-header">
        <h3>Retirer l'athlète</h3>
        <button class="modal-close" id="confirm-remove-cancel"><i data-lucide="x"></i></button>
      </div>
      <p style="font-size:14px;color:var(--text-muted);padding:0 0 16px">
        Retirer <strong id="confirm-remove-name"></strong> de ta liste ? Tu ne pourras plus voir ses séances.
      </p>
      <div style="display:flex;gap:10px">
        <button class="btn-secondary" id="confirm-remove-cancel2" style="flex:1">Annuler</button>
        <button class="btn-primary" id="confirm-remove-ok" style="flex:1;background:#e53e3e;border-color:#e53e3e">Retirer</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="js/core.js"></script>
  <script>
    lucide.createIcons();

    // ── MODALE RETIRER ──────────────────────────────────────
    let removeTargetId = null;
    function closeConfirmRemove() {
      document.getElementById('confirm-remove-overlay').classList.remove('open');
    }
    document.getElementById('confirm-remove-cancel').addEventListener('click', closeConfirmRemove);
    document.getElementById('confirm-remove-cancel2').addEventListener('click', closeConfirmRemove);
    document.getElementById('confirm-remove-overlay').addEventListener('click', e => {
      if (e.target.id === 'confirm-remove-overlay') closeConfirmRemove();
    });
    document.getElementById('confirm-remove-ok').addEventListener('click', async () => {
      const btn = document.getElementById('confirm-remove-ok');
      btn.disabled = true; btn.textContent = '…';
      const { data: { session } } = await _supabase.auth.getSession();
      if (session && removeTargetId) {
        await _supabase.from('coaching_requests').delete()
          .or(`and(sender_id.eq.${session.user.id},recipient_id.eq.${removeTargetId}),and(sender_id.eq.${removeTargetId},recipient_id.eq.${session.user.id})`);
      }
      closeConfirmRemove();
      btn.disabled = false; btn.textContent = 'Retirer';
      // Retire la carte de l'athlète de la liste
      document.getElementById(`athlete-card-${removeTargetId}`)?.remove();
      removeTargetId = null;
    });

    function getInitials(name) {
      if (!name) return '?';
      return name.trim().slice(0, 2).toUpperCase();
    }

    checkAuth().then(async () => {
      const listEl = document.getElementById('prat-list');
      const { data: { session } } = await _supabase.auth.getSession();

      const { data: accepted } = await _supabase
        .from('coaching_requests')
        .select('recipient_id')
        .eq('sender_id', session.user.id)
        .eq('status', 'accepted');

      if (!accepted || accepted.length === 0) {
        listEl.innerHTML = `
          <div class="prat-empty">
            <div class="prat-empty-icon"><i data-lucide="users"></i></div>
            <p>Aucun athlète pour l'instant.<br>Recherche des personnes et envoie-leur une demande.</p>
          </div>`;
        lucide.createIcons();
        return;
      }

      const ids = accepted.map(r => r.recipient_id);
      const { data: profiles } = await _supabase
        .from('profiles')
        .select('user_id, name, username, photo')
        .in('user_id', ids);

      if (!profiles || profiles.length === 0) {
        listEl.innerHTML = `<div class="prat-empty"><p>Impossible de charger les profils.</p></div>`;
        return;
      }

      listEl.innerHTML = '';

      const sectionLabel = document.createElement('div');
      sectionLabel.className = 'prat-section-label';
      sectionLabel.textContent = `${profiles.length} athlète${profiles.length > 1 ? 's' : ''}`;
      listEl.appendChild(sectionLabel);

      const card = document.createElement('div');
      card.className = 'prat-card';

      profiles.forEach(p => {
        const row = document.createElement('div');
        row.className = 'prat-row';
        row.style.cursor = 'pointer';
        row.addEventListener('click', () => {
          const name = encodeURIComponent(p.username || p.name || '');
          window.location.href = `athlete-profile.html?id=${p.user_id}&name=${name}`;
        });

        const avatar = document.createElement('div');
        avatar.className = 'prat-avatar';
        avatar.textContent = getInitials(p.username || p.name);

        const info = document.createElement('div');
        info.className = 'prat-info';
        info.innerHTML = `<div class="prat-name">@${esc(p.username || p.name || '—')}</div>`;

        const btnRowRemove = document.createElement('button');
        btnRowRemove.className = 'prat-remove-btn';
        btnRowRemove.title = 'Retirer cet athlète';
        btnRowRemove.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="17" y1="8" x2="23" y2="14"/><line x1="23" y1="8" x2="17" y2="14"/></svg>`;
        btnRowRemove.onclick = (e) => {
          e.stopPropagation();
          removeTargetId = p.user_id;
          document.getElementById('confirm-remove-name').textContent = `@${p.username || p.name || '?'}`;
          document.getElementById('confirm-remove-overlay').classList.add('open');
        };

        row.appendChild(avatar);
        row.appendChild(info);
        row.appendChild(btnRowRemove);
        card.appendChild(row);

        // Boutons d'action sous chaque athlète
        const actions = document.createElement('div');
        actions.className = 'prat-actions';
        actions.id = `athlete-card-${p.user_id}`;

        const btnActivites = document.createElement('button');
        btnActivites.className = 'prat-action-btn';
        btnActivites.textContent = 'Activités';
        btnActivites.onclick = (e) => {
          e.stopPropagation();
          const name = encodeURIComponent(p.username || p.name || '');
          window.location.href = `athlete-profile.html?id=${p.user_id}&name=${name}`;
        };

        const btnAddSession = document.createElement('button');
        btnAddSession.className = 'prat-action-btn';
        btnAddSession.textContent = '+ Séance';
        btnAddSession.onclick = (e) => {
          e.stopPropagation();
          const name     = encodeURIComponent(p.username || p.name || '');
          const username = encodeURIComponent(p.username || '');
          window.location.href = `share-session.html?recipient_id=${p.user_id}&recipient_name=${name}&recipient_username=${username}`;
        };

        actions.appendChild(btnActivites);
        actions.appendChild(btnAddSession);
        card.appendChild(actions);
      });

      listEl.appendChild(card);
      lucide.createIcons();
    });
  </script>

</body>
</html>
