<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Activités – ARMAZ</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/form.css">
  <link rel="stylesheet" href="css/home.css">
  <style>
    body { overflow-y: auto; height: auto; min-height: 100vh; padding-bottom: 80px; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; }

    .session-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 10px;
    }

    .session-card .profil-link-row {
      border-top: none;
    }
  </style>
</head>
<body>

  <header>
    <button class="icon-btn" onclick="history.back()"><i data-lucide="arrow-left"></i></button>
    <div class="header-title">Activités</div>
    <div style="width:38px"></div>
  </header>

  <div class="activites-list" id="activites-list"></div>

  <!-- MODAL VUE SÉANCE (lecture seule) -->
  <div class="modal-overlay" id="session-view-overlay">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h3>Séance</h3>
          <span class="modal-date-label" id="session-view-date"></span>
        </div>
        <button class="modal-close" id="session-view-close"><i data-lucide="x"></i></button>
      </div>
      <div id="session-view-content"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/core.js"></script>
  <script src="js/modal.js"></script>
  <script>
    lucide.createIcons();

    function formatDayLabel(key) {
      const d = parseKey(key);
      return `${DAYS_LONG[d.getDay()]} ${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}`;
    }

    function sessionRow(key, s, commentMap) {
      const exoNames = s.exercises ? s.exercises.map(e => e.name).filter(Boolean) : [];
      const sub   = exoNames.length > 0 ? exoNames.join(', ') : 'Séance planifiée';
      const badge = s.completed ? ' <span class="activites-badge">✓</span>' : '';
      const c     = commentMap[key];
      const commentHtml = c ? `
        <div class="comment-block">
          <div class="comment-coach-label">Coach · @${c.coach_username}</div>
          <div class="comment-existing">${c.comment}</div>
        </div>` : '';
      return `
        <div class="session-card">
          <div class="profil-link-row" style="cursor:pointer" onclick="openSessionViewModal('${key}')">
            <div class="profil-link-icon"><i data-lucide="dumbbell"></i></div>
            <div class="profil-link-info">
              <span class="profil-link-title">${formatDayLabel(key)}${badge}</span>
              <span class="profil-link-sub">${sub}</span>
            </div>
            <i data-lucide="chevron-right" class="profil-link-arrow"></i>
          </div>
          ${commentHtml}
        </div>`;
    }

    function render(commentMap) {
      const sessions = getSessions();
      const todayKey = dateToKey(new Date());
      const list     = document.getElementById('activites-list');
      const all      = Object.entries(sessions);

      const future = all
        .filter(([key, s]) => key > todayKey || (key === todayKey && !s.completed))
        .sort((a, b) => a[0].localeCompare(b[0]));

      const past = all
        .filter(([key, s]) => key < todayKey || (key === todayKey && s.completed))
        .sort((a, b) => b[0].localeCompare(a[0]));

      if (all.length === 0) {
        list.innerHTML = '<p class="activites-empty">Aucune séance pour l\'instant.</p>';
        return;
      }

      let html = '';

      if (future.length > 0) {
        html += `<div class="activites-month-label">À venir</div>`;
        future.forEach(([key, s]) => { html += sessionRow(key, s, commentMap); });
      }

      if (past.length > 0) {
        const groups = {};
        past.forEach(([key, s]) => {
          const ym = key.slice(0, 7);
          if (!groups[ym]) groups[ym] = [];
          groups[ym].push([key, s]);
        });
        Object.entries(groups)
          .sort((a, b) => b[0].localeCompare(a[0]))
          .forEach(([ym, entries]) => {
            const [y, m] = ym.split('-').map(Number);
            html += `<div class="activites-month-label">${MONTHS[m - 1]} ${y}</div>`;
            entries.forEach(([key, s]) => { html += sessionRow(key, s, commentMap); });
          });
      }

      list.innerHTML = html;
      lucide.createIcons();
    }

    checkAuth().then(async (user) => {
      const commentMap = {};
      if (user) {
        const { data: comments } = await _supabase
          .from('session_comments')
          .select('id, date_key, comment, coach_username, read')
          .eq('athlete_id', user.id);

        const unreadIds = [];
        (comments || []).forEach(c => {
          commentMap[c.date_key] = c;
          if (!c.read) unreadIds.push(c.id);
        });

        if (unreadIds.length > 0) {
          _supabase.from('session_comments').update({ read: true }).in('id', unreadIds);
        }
      }
      render(commentMap);
    });
  </script>

  <nav class="bottom-nav">
    <button class="nav-btn" onclick="window.location.href='index.html'">
      <i data-lucide="home"></i><span>Accueil</span>
    </button>
    <button class="nav-btn" onclick="window.location.href='share-session.html'">
      <i data-lucide="plus"></i><span>Partager</span>
    </button>
    <button class="nav-btn" onclick="window.location.href='reglages.html'">
      <i data-lucide="user"></i><span>Profil</span>
    </button>
  </nav>
  <script>lucide.createIcons();</script>

</body>
</html>
