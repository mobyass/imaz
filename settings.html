<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://*.supabase.co;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    connect-src 'self' https://*.supabase.co https://*.supabase.io wss://*.supabase.co;
    img-src 'self' data: blob: https://*.supabase.co https://*.supabase.io;
    font-src 'self' data: https://fonts.gstatic.com;
    frame-src 'none';
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  ">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Réglages – ARMAZ</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/settings.css">
  <style>
    body { overflow-y: auto; height: auto; min-height: 100vh; }
    .settings-container { padding-bottom: 40px; }
  </style>
</head>
<body>

  <header>
    <button class="icon-btn" id="back-btn"><i data-lucide="arrow-left"></i></button>
    <div class="header-title">Réglages</div>
    <div style="width:38px"></div>
  </header>

  <div class="settings-container">

    <!-- ── PROFIL ── -->
    <div class="settings-section">
      <h3 class="settings-section-title">Profil</h3>

      <div class="settings-avatar-wrap">
        <div class="settings-avatar" id="settings-avatar" style="cursor:default">
          <span id="settings-initials"></span>
        </div>
      </div>

      <div class="settings-row">
        <span class="settings-label">Pseudo</span>
        <input class="settings-text-input" type="text" id="settings-username" placeholder="pseudo" maxlength="30">
      </div>

      <div class="settings-row" id="settings-save-row" style="flex-direction:column;align-items:stretch;gap:8px;display:none">
        <p class="settings-save-msg" id="profil-save-msg" style="display:none"></p>
        <button class="btn-primary" id="settings-profil-save">Enregistrer</button>
      </div>
    </div>

    <!-- ── UNITÉS ── -->
    <div class="settings-section">
      <h3 class="settings-section-title">Unités</h3>

      <div class="settings-row">
        <div class="settings-row-info">
          <span class="settings-label">Unité de poids</span>
        </div>
        <div class="toggle-group" data-setting="weightUnit">
          <button class="toggle-opt" data-value="kg">kg</button>
          <button class="toggle-opt" data-value="lbs">lbs</button>
        </div>
      </div>

      <div class="settings-row" id="row-rest-unit">
        <div class="settings-row-info">
          <span class="settings-label">Unité de récupération</span>
        </div>
        <div class="toggle-group" data-setting="restUnit">
          <button class="toggle-opt" data-value="s">sec</button>
          <button class="toggle-opt" data-value="min">min</button>
        </div>
      </div>
    </div>

    <!-- ── EXERCICES ── -->
    <div class="settings-section">
      <h3 class="settings-section-title">Exercices</h3>

      <div class="settings-row">
        <div class="settings-row-info">
          <span class="settings-label">Vue par défaut</span>
          <span class="settings-desc">Pour les nouveaux exercices</span>
        </div>
        <div class="toggle-group" data-setting="defaultView">
          <button class="toggle-opt" data-value="uniform">Uniforme</button>
          <button class="toggle-opt" data-value="custom">Par série</button>
        </div>
      </div>
    </div>

    <!-- ── RÉCUPÉRATION ── -->
    <div class="settings-section">
      <h3 class="settings-section-title">Récupération</h3>

      <div class="settings-row">
        <div class="settings-row-info">
          <span class="settings-label">Activer la récupération</span>
          <span class="settings-desc">Temps de récup. et minuteur</span>
        </div>
        <label class="settings-switch">
          <input type="checkbox" id="setting-rest-enabled">
          <span class="settings-switch-track"></span>
        </label>
      </div>

      <div class="settings-row" id="row-alert-level">
        <div class="settings-row-info">
          <span class="settings-label">Alerte de fin</span>
          <span class="settings-desc">Son joué à la fin du minuteur</span>
        </div>
        <div class="toggle-group" data-setting="alertLevel">
          <button class="toggle-opt toggle-opt-icon" data-value="vibrate" title="Vibration uniquement">
            <i data-lucide="smartphone"></i>
          </button>
          <button class="toggle-opt toggle-opt-icon" data-value="normal" title="Normal">
            <i data-lucide="volume-1"></i>
          </button>
          <button class="toggle-opt toggle-opt-icon" data-value="loud" title="Fort">
            <i data-lucide="volume-2"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- ── SUGGESTIONS ── -->
    <div class="settings-section" style="margin-top:8px">
      <h3 class="settings-section-title">Suggestions</h3>
      <div style="padding:0 16px 16px">
        <textarea id="feedback-text" placeholder="Une idée, un bug, une amélioration…" rows="4" maxlength="1000"
          style="width:100%;box-sizing:border-box;background:var(--surface-2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:14px;font-size:14px;color:var(--text);resize:vertical;font-family:inherit;outline:none;display:block;transition:border-color 0.15s"
          onfocus="this.style.borderColor='var(--accent)'"
          onblur="this.style.borderColor='var(--border)'"></textarea>
        <p id="feedback-msg" style="display:none;font-size:12px;margin:8px 0 0"></p>
        <button id="btn-feedback-send" style="margin-top:12px;background:var(--accent);border:none;border-radius:var(--radius-sm);padding:12px 24px;font-size:14px;font-weight:700;color:white;cursor:pointer">Envoyer</button>
      </div>
    </div>

    <!-- ── COMPTE ── -->
    <div class="settings-section" style="margin-top:8px">
      <div class="settings-row">
        <div class="settings-row-info">
          <span class="settings-label">Compte</span>
          <span class="settings-desc">Se déconnecter de l'application</span>
        </div>
        <button class="btn-secondary" id="btn-logout" style="flex-shrink:0;font-size:13px;padding:6px 14px">
          Déconnexion
        </button>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="js/core.js"></script>
  <script>
    checkAuth();
    document.getElementById('back-btn').addEventListener('click', () => history.back());
    document.getElementById('btn-logout').addEventListener('click', logout);
    lucide.createIcons();


  </script>
  <script src="js/settings.js"></script>

  <script>
    // ── PROFIL SECTION ──
    const settingsUsername = document.getElementById('settings-username');
    const profilSaveMsg    = document.getElementById('profil-save-msg');
    const saveRow          = document.getElementById('settings-save-row');
    let refUsername        = localStorage.getItem('imaz_profil_username') || '';

    function getInitials(u) {
      return u.trim().slice(0, 2).toUpperCase();
    }
    function refreshAvatar() {
      document.getElementById('settings-initials').textContent = getInitials(localStorage.getItem('imaz_profil_username') || '');
    }
    refreshAvatar();

    // Règles pseudo : lettres, chiffres, _ et . — min 3 chars, pas de . consécutifs, pas . en début/fin
    function validateUsername(u) {
      if (u.length < 3)              return 'Le pseudo doit faire au moins 3 caractères.';
      if (!/^[a-z0-9._]+$/.test(u)) return 'Lettres, chiffres, _ et . uniquement.';
      if (u.startsWith('.') || u.endsWith('.')) return 'Le pseudo ne peut pas commencer ou finir par un point.';
      if (/\.\./.test(u))            return 'Pas de deux points consécutifs.';
      return null;
    }

    settingsUsername.value = refUsername;

    // Récupère le pseudo depuis Supabase si absent
    if (!refUsername) {
      _supabase.auth.getUser().then(({ data: { user } }) => {
        if (!user) return;
        _supabase.from('profiles').select('username').eq('user_id', user.id).maybeSingle().then(({ data }) => {
          if (data?.username) {
            localStorage.setItem('imaz_profil_username', data.username);
            localStorage.setItem('imaz_profil_name', data.username);
            refUsername = data.username;
            settingsUsername.value = data.username;
            refreshAvatar();
          }
        });
      });
    }

    function checkChanges() {
      const changed = settingsUsername.value.trim() !== refUsername;
      saveRow.style.display = changed ? '' : 'none';
    }
    settingsUsername.addEventListener('input', () => {
      const pos = settingsUsername.selectionStart;
      settingsUsername.value = settingsUsername.value.toLowerCase();
      settingsUsername.setSelectionRange(pos, pos);
      checkChanges();
    });

    // Save
    document.getElementById('settings-profil-save').addEventListener('click', async () => {
      const username = settingsUsername.value.trim().toLowerCase();

      const validErr = validateUsername(username);
      if (validErr) { showProfilMsg(validErr, 'error'); return; }

      const { data: { user } } = await _supabase.auth.getUser();
      const currentUsername = localStorage.getItem('imaz_profil_username') || '';
      if (username !== currentUsername) {
        const { data: existing } = await _supabase
          .from('profiles')
          .select('user_id')
          .eq('username', username)
          .neq('user_id', user.id)
          .maybeSingle();
        if (existing) { showProfilMsg('Ce pseudo est déjà pris.', 'error'); return; }
      }

      localStorage.setItem('imaz_profil_name',     username);
      localStorage.setItem('imaz_profil_username', username);

      const { error: syncErr } = await _supabase.from('profiles').upsert(
        { user_id: user.id, name: username, username, updated_at: new Date().toISOString() },
        { onConflict: 'user_id' }
      );
      if (syncErr) { showProfilMsg('Erreur BD : ' + syncErr.message, 'error'); return; }

      refUsername = username;
      refreshAvatar();
      showProfilMsg('Profil enregistré !', 'success');
      setTimeout(() => { saveRow.style.display = 'none'; }, 3000);
    });

    // ── FEEDBACK ──
    document.getElementById('btn-feedback-send').addEventListener('click', async () => {
      const text = document.getElementById('feedback-text').value.trim();
      const msg  = document.getElementById('feedback-msg');
      if (!text) {
        msg.textContent = 'Écris ton message avant d\'envoyer.';
        msg.style.color = '#e53e3e';
        msg.style.display = '';
        return;
      }
      const { data: { user } } = await _supabase.auth.getUser();
      const username = localStorage.getItem('imaz_profil_username') || '';
      const { error } = await _supabase.from('feedback').insert({
        user_id: user?.id,
        username,
        message: text
      });
      if (error) {
        msg.textContent = 'Erreur lors de l\'envoi, réessaie.';
        msg.style.color = '#e53e3e';
      } else {
        document.getElementById('feedback-text').value = '';
        msg.textContent = 'Merci pour ton retour !';
        msg.style.color = '#48c78e';
      }
      msg.style.display = '';
      setTimeout(() => { msg.style.display = 'none'; }, 3000);
    });

    function showProfilMsg(msg, type) {
      profilSaveMsg.textContent = msg;
      profilSaveMsg.className = `settings-save-msg ${type}`;
      profilSaveMsg.style.display = '';
      setTimeout(() => { profilSaveMsg.style.display = 'none'; }, 3000);
    }

  </script>

</body>
</html>
