<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Activités athlète – ARMAZ</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/form.css">
  <link rel="stylesheet" href="css/home.css">
  <style>
    body { overflow-y: auto; height: auto; min-height: 100vh; padding-bottom: 40px; }

    .session-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin: 0 0 10px;
    }

    .session-card .profil-link-row {
      border-radius: 0;
      border: none;
      margin: 0;
    }

    .comment-area {
      border-top: 1px solid var(--border);
      padding: 10px 14px 12px;
    }

    .comment-toggle-btn {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 9px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-family: inherit;
      transition: background 0.15s;
    }

    .comment-toggle-btn:hover { background: var(--accent-dim); color: var(--accent); }
    .comment-toggle-btn svg  { width: 15px; height: 15px; }

    /* Texte du commentaire — cliquer dessus pour éditer */
    .comment-display {
      font-size: 13px;
      color: var(--text);
      line-height: 1.4;
      cursor: pointer;
      background: var(--accent-dim);
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 8px 12px;
      user-select: text;
      transition: filter 0.12s;
    }

    .comment-display:hover { filter: brightness(0.94); }

    .comment-form { margin-top: 0; }

    .comment-form-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 8px;
    }

    .comment-cancel-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      cursor: pointer;
      font-family: inherit;
    }

    .comment-send-btn {
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      color: white;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 16px;
      cursor: pointer;
      font-family: inherit;
    }

    .comment-send-btn:disabled { opacity: 0.5; }

    .activites-month-label { padding-left: 0; }
  </style>
</head>
<body>

  <header>
    <button class="icon-btn" onclick="history.back()"><i data-lucide="arrow-left"></i></button>
    <div class="header-title" id="page-title">Athlète</div>
    <div style="width:38px"></div>
  </header>

  <div class="activites-list" id="activites-list">
    <p style="padding:24px;color:var(--text-muted);text-align:center">Chargement…</p>
  </div>

  <!-- MODAL VUE SÉANCE (lecture seule) -->
  <div class="modal-overlay" id="session-view-overlay">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h3>Séance</h3>
          <span class="modal-date-label" id="session-view-date"></span>
        </div>
        <button class="modal-close" id="session-view-close"><i data-lucide="x"></i></button>
      </div>
      <div id="session-view-content"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/core.js"></script>
  <script>
    lucide.createIcons();

    const params    = new URLSearchParams(location.search);
    const athleteId = params.get('id');
    const name      = decodeURIComponent(params.get('name') || '');
    document.getElementById('page-title').textContent = name ? `@${name}` : 'Athlète';

    function formatDayLabel(key) {
      const d = parseKey(key);
      return `${DAYS_LONG[d.getDay()]} ${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}`;
    }

    // Ouvre la modal avec les données directement (sans localStorage)
    function openAthleteSessionModal(data, key) {
      const settings = getSettings();
      document.getElementById('session-view-date').textContent = formatDayLabel(key);

      const content    = document.getElementById('session-view-content');
      const exercises  = data.exercises || [];

      if (exercises.length === 0) {
        content.innerHTML = '<p class="empty-state">Aucun exercice enregistré</p>';
      } else {
        content.innerHTML = exercises.map(e => {
          const sets = normalizeSets(e);
          return `
            <div class="seance-log-exo">
              <div class="log-exo-name">${e.name}</div>
              <div class="log-table log-table--readonly">
                <div class="log-table-head">
                  <span></span><span>Rép</span><span>${settings.weightUnit}</span>
                </div>
                ${sets.map((s, si) => {
                  const done  = e.done && e.done[si] ? e.done[si] : {};
                  const repsV = done.reps   !== undefined && done.reps   !== null ? done.reps   : (s.reps   ?? '');
                  const wgtV  = done.weight !== undefined && done.weight !== null ? done.weight : (s.weight ?? '');
                  const isVal = done.validated === true;
                  return `
                    <div class="log-table-row ${isVal ? 'validated' : ''}">
                      <span class="log-set-num">S${si + 1}</span>
                      <span class="log-val-text">${repsV !== '' ? repsV : '—'}</span>
                      <span class="log-val-text">${wgtV  !== '' ? wgtV  : '—'}</span>
                    </div>`;
                }).join('')}
              </div>
            </div>`;
        }).join('');
      }

      document.getElementById('session-view-overlay').classList.add('open');
      lucide.createIcons();
    }

    // Fermer la modal
    document.getElementById('session-view-close').addEventListener('click', () => {
      document.getElementById('session-view-overlay').classList.remove('open');
    });
    document.getElementById('session-view-overlay').addEventListener('click', e => {
      if (e.target.id === 'session-view-overlay')
        document.getElementById('session-view-overlay').classList.remove('open');
    });

    checkAuth().then(async (user) => {
      const list = document.getElementById('activites-list');

      if (!athleteId) {
        list.innerHTML = '<p class="activites-empty">Athlète introuvable.</p>';
        return;
      }

      const { data: rows, error } = await _supabase
        .from('sessions')
        .select('date_key, data')
        .eq('user_id', athleteId)
        .order('date_key', { ascending: false });

      if (error || !rows || rows.length === 0) {
        list.innerHTML = '<p class="activites-empty">Aucune séance pour cet athlète.</p>';
        return;
      }

      const todayKey      = dateToKey(new Date());
      const coachUsername = localStorage.getItem('imaz_profil_username') || '';

      const { data: existingComments } = await _supabase
        .from('session_comments')
        .select('id, date_key, comment')
        .eq('coach_id', user.id)
        .eq('athlete_id', athleteId);
      const commentMap = {};
      (existingComments || []).forEach(c => { commentMap[c.date_key] = { id: c.id, comment: c.comment }; });

      function existingHtml(key, text) {
        return `
          <div class="comment-display" id="cv-${key}" onclick="startEdit('${key}')">${text}</div>
          <div class="comment-form" id="cf-${key}" style="display:none">
            <textarea class="comment-textarea" rows="2">${text}</textarea>
            <div class="comment-form-actions">
              <button class="comment-cancel-btn" onclick="cancelComment('${key}')">Annuler</button>
              <button class="comment-send-btn" onclick="submitComment('${key}')">Enregistrer</button>
            </div>
          </div>`;
      }

      function commentAreaHtml(key) {
        const c = commentMap[key];
        if (c) {
          return `<div class="comment-area" id="ca-${key}">${existingHtml(key, c.comment)}</div>`;
        }
        return `
          <div class="comment-area" id="ca-${key}">
            <button class="comment-toggle-btn" id="ctb-${key}" onclick="toggleNew('${key}')">
              <i data-lucide="message-circle"></i> Laisser un commentaire
            </button>
            <div class="comment-form" id="cf-${key}" style="display:none">
              <textarea class="comment-textarea" rows="2" placeholder="Laisser un commentaire…"></textarea>
              <div class="comment-form-actions">
                <button class="comment-cancel-btn" onclick="cancelComment('${key}')">Annuler</button>
                <button class="comment-send-btn" onclick="submitComment('${key}')">Envoyer</button>
              </div>
            </div>
          </div>`;
      }

      window.toggleNew = function(key) {
        const btn  = document.getElementById(`ctb-${key}`);
        const form = document.getElementById(`cf-${key}`);
        btn.style.display = 'none';
        form.style.display = '';
        form.querySelector('textarea').focus();
      };

      window.startEdit = function(key) {
        document.getElementById(`cv-${key}`).style.display = 'none';
        const form = document.getElementById(`cf-${key}`);
        form.querySelector('textarea').value = commentMap[key].comment;
        form.style.display = '';
        form.querySelector('textarea').focus();
      };

      window.cancelComment = function(key) {
        document.getElementById(`cf-${key}`).style.display = 'none';
        const cv  = document.getElementById(`cv-${key}`);
        const btn = document.getElementById(`ctb-${key}`);
        if (cv)  cv.style.display  = '';   // modifier commentaire existant → reafficher le texte
        if (btn) btn.style.display = '';   // nouveau commentaire → reafficher le bouton
      };

      window.submitComment = async function(key) {
        const form = document.getElementById(`cf-${key}`);
        const text = form.querySelector('textarea').value.trim();
        if (!text) return;
        const btn = form.querySelector('.comment-send-btn');
        btn.disabled = true;
        btn.textContent = '…';

        const existing = commentMap[key];
        let error;

        if (existing) {
          // Supprimer puis réinsérer — contourne la restriction RLS UPDATE (athlete only)
          await _supabase.from('session_comments').delete().eq('id', existing.id);
          const res = await _supabase.from('session_comments').insert({
            coach_id:       user.id,
            coach_username: coachUsername,
            athlete_id:     athleteId,
            date_key:       key,
            comment:        text,
            read:           false
          }).select('id').single();
          error = res.error;
          if (!res.error) commentMap[key] = { id: res.data.id, comment: text };
        } else {
          const res = await _supabase.from('session_comments').insert({
            coach_id:       user.id,
            coach_username: coachUsername,
            athlete_id:     athleteId,
            date_key:       key,
            comment:        text,
            read:           false
          }).select('id').single();
          error = res.error;
          if (!res.error) commentMap[key] = { id: res.data.id, comment: text };
        }

        if (error) {
          btn.disabled = false;
          btn.textContent = existing ? 'Enregistrer' : 'Envoyer';
          return;
        }

        const area = document.getElementById(`ca-${key}`);
        area.innerHTML = existingHtml(key, commentMap[key].comment);
        lucide.createIcons();
      };

      function athleteRow(r) {
        const s   = r.data;
        const key = r.date_key;
        const exoNames = s.exercises ? s.exercises.map(e => e.name).filter(Boolean) : [];
        const sub   = exoNames.length > 0 ? exoNames.join(', ') : 'Séance planifiée';
        const badge = s.completed ? ' <span class="activites-badge">✓</span>' : '';
        const dataAttr = encodeURIComponent(JSON.stringify(s));
        return `
          <div class="session-card">
            <div class="profil-link-row" style="cursor:pointer"
                 onclick="openAthleteSessionModal(JSON.parse(decodeURIComponent('${dataAttr}')), '${key}')">
              <div class="profil-link-icon"><i data-lucide="dumbbell"></i></div>
              <div class="profil-link-info">
                <span class="profil-link-title">${formatDayLabel(key)}${badge}</span>
                <span class="profil-link-sub">${sub}</span>
              </div>
              <i data-lucide="chevron-right" class="profil-link-arrow"></i>
            </div>
            ${commentAreaHtml(key)}
          </div>`;
      }

      const future = rows.filter(r => r.date_key > todayKey || (r.date_key === todayKey && !r.data?.completed))
                         .sort((a, b) => a.date_key.localeCompare(b.date_key));
      const past   = rows.filter(r => r.date_key < todayKey || (r.date_key === todayKey && r.data?.completed));

      let html = '';

      if (future.length > 0) {
        html += `<div class="activites-month-label">À venir</div>`;
        future.forEach(r => { html += athleteRow(r); });
      }

      if (past.length > 0) {
        const groups = {};
        past.forEach(r => {
          const ym = r.date_key.slice(0, 7);
          if (!groups[ym]) groups[ym] = [];
          groups[ym].push(r);
        });
        Object.entries(groups)
          .sort((a, b) => b[0].localeCompare(a[0]))
          .forEach(([ym, entries]) => {
            const [y, m] = ym.split('-').map(Number);
            html += `<div class="activites-month-label">${MONTHS[m - 1]} ${y}</div>`;
            entries.forEach(r => { html += athleteRow(r); });
          });
      }

      list.innerHTML = html;
      lucide.createIcons();
    });
  </script>

</body>
</html>
