<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion – Imaz</title>
  <link rel="stylesheet" href="css/base.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 20px;
    }

    .login-card {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .login-logo { text-align: center; }

    .login-logo-text {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -1px;
      color: var(--accent);
    }

    .login-logo-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .login-tabs {
      display: flex;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
    }

    .login-tab {
      flex: 1;
      background: none;
      border: none;
      border-radius: 7px;
      padding: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .login-tab.active {
      background: var(--surface);
      color: var(--text);
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .login-field { position: relative; }

    .login-input {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 44px 13px 14px;
      color: var(--text);
      font-size: 15px;
      width: 100%;
      box-sizing: border-box;
    }

    .login-input.no-icon { padding-right: 14px; }

    .login-input:focus { border-color: var(--accent); outline: none; }

    .login-input::placeholder { color: var(--text-muted); }

    .login-eye {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      line-height: 1;
    }
    .login-eye svg { width: 18px; height: 18px; }

    /* ── Choix du rôle ── */
    .login-role-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-align: center;
    }

    .login-role-group {
      display: flex;
      gap: 10px;
    }

    .login-role-opt {
      flex: 1;
      background: var(--surface-2);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    .login-role-opt.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    .login-role-opt svg { width: 22px; height: 22px; }

    .login-error {
      font-size: 13px;
      color: #e53e3e;
      text-align: center;
      min-height: 18px;
    }

    .login-submit { margin-top: 4px; }

    .login-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
      font-size: 12px;
    }
    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .btn-guest {
      width: 100%;
      background: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-guest:hover {
      border-color: var(--text-muted);
      color: var(--text);
    }
  </style>
</head>
<body>

  <div class="login-card">

    <div class="login-logo">
      <div class="login-logo-text">Imaz</div>
      <div class="login-logo-sub">Ton carnet d'entraînement</div>
    </div>

    <div class="login-tabs">
      <button class="login-tab active" id="tab-login">Connexion</button>
      <button class="login-tab"        id="tab-signup">Inscription</button>
    </div>

    <div class="login-form">

      <!-- Pseudo (inscription uniquement) -->
      <div class="login-field" id="field-username" style="display:none">
        <input class="login-input no-icon" type="text" id="input-username"
               placeholder="Pseudo (unique)" autocomplete="username">
      </div>

      <!-- Rôle (inscription uniquement) -->
      <div id="field-role" style="display:none">
        <p class="login-role-label">Je suis…</p>
        <div class="login-role-group">
          <button class="login-role-opt active" id="role-athlete" type="button">
            <i data-lucide="dumbbell"></i>
            Athlète
          </button>
          <button class="login-role-opt" id="role-coach" type="button">
            <i data-lucide="clipboard-list"></i>
            Coach
          </button>
        </div>
      </div>

      <!-- Email -->
      <div class="login-field">
        <input class="login-input no-icon" type="email" id="input-email"
               placeholder="Adresse e-mail" autocomplete="email">
      </div>

      <!-- Mot de passe -->
      <div class="login-field">
        <input class="login-input" type="password" id="input-password"
               placeholder="Mot de passe" autocomplete="current-password">
        <button class="login-eye" id="toggle-pw" type="button">
          <i data-lucide="eye"></i>
        </button>
      </div>

      <!-- Confirmation (inscription uniquement) -->
      <div class="login-field" id="field-confirm" style="display:none">
        <input class="login-input" type="password" id="input-confirm"
               placeholder="Confirmer le mot de passe" autocomplete="new-password">
        <button class="login-eye" id="toggle-confirm" type="button">
          <i data-lucide="eye"></i>
        </button>
      </div>

      <div class="login-error" id="login-error"></div>
      <button class="btn-primary login-submit" id="btn-submit">Se connecter</button>


    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();

    // Redirect to app if already logged in
    _supabase.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = 'index.html';
    });

    let mode         = 'login';
    let selectedRole = 'athlete';

    const tabLogin      = document.getElementById('tab-login');
    const tabSignup     = document.getElementById('tab-signup');
    const btnSubmit     = document.getElementById('btn-submit');
    const errEl         = document.getElementById('login-error');
    const pwInput       = document.getElementById('input-password');
    const confirmInput  = document.getElementById('input-confirm');
    const usernameInput = document.getElementById('input-username');
    const fieldUsername = document.getElementById('field-username');
    const fieldConfirm  = document.getElementById('field-confirm');
    const fieldRole     = document.getElementById('field-role');

    function setMode(m) {
      mode = m;
      const isSignup = m === 'signup';
      tabLogin.classList.toggle('active', !isSignup);
      tabSignup.classList.toggle('active',  isSignup);
      btnSubmit.textContent = isSignup ? "S'inscrire" : 'Se connecter';
      pwInput.autocomplete  = isSignup ? 'new-password' : 'current-password';
      fieldUsername.style.display = isSignup ? '' : 'none';
      fieldConfirm.style.display  = isSignup ? '' : 'none';
      fieldRole.style.display     = isSignup ? '' : 'none';
      errEl.textContent = '';
    }

    // ── Sélection du rôle ──
    document.getElementById('role-athlete').addEventListener('click', () => {
      selectedRole = 'athlete';
      document.getElementById('role-athlete').classList.add('active');
      document.getElementById('role-coach').classList.remove('active');
    });
    document.getElementById('role-coach').addEventListener('click', () => {
      selectedRole = 'coach';
      document.getElementById('role-coach').classList.add('active');
      document.getElementById('role-athlete').classList.remove('active');
    });

    tabLogin.addEventListener('click',  () => setMode('login'));
    tabSignup.addEventListener('click', () => setMode('signup'));

    // Force lowercase sur le pseudo
    usernameInput.addEventListener('input', () => {
      const pos = usernameInput.selectionStart;
      usernameInput.value = usernameInput.value.toLowerCase();
      usernameInput.setSelectionRange(pos, pos);
    });

    // ── Eye toggles ──
    function makeEyeToggle(btnId, input) {
      document.getElementById(btnId).addEventListener('click', () => {
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        const icon = document.querySelector(`#${btnId} i`);
        icon.setAttribute('data-lucide', show ? 'eye-off' : 'eye');
        lucide.createIcons();
      });
    }
    makeEyeToggle('toggle-pw',      pwInput);
    makeEyeToggle('toggle-confirm', confirmInput);


    // ── Submit ──
    btnSubmit.addEventListener('click', async () => {
      const email    = document.getElementById('input-email').value.trim();
      const password = pwInput.value;
      const confirm  = confirmInput.value;
      const username = usernameInput.value.trim().toLowerCase();
      errEl.textContent = '';

      if (!email || !password) {
        errEl.textContent = 'Remplis tous les champs.';
        return;
      }

      if (mode === 'signup') {
        if (!username) {
          errEl.textContent = 'Choisis un pseudo.';
          return;
        }
        if (password !== confirm) {
          errEl.textContent = 'Les mots de passe ne correspondent pas.';
          return;
        }
        // Vérifie que le pseudo n'est pas déjà pris
        const { data: existing } = await _supabase
          .from('profiles')
          .select('user_id')
          .eq('username', username)
          .maybeSingle();
        if (existing) {
          errEl.textContent = 'Ce pseudo est déjà pris.';
          return;
        }
      }

      btnSubmit.disabled = true;
      btnSubmit.textContent = '…';

      if (mode === 'login') {
        const { error } = await _supabase.auth.signInWithPassword({ email, password });
        if (error) {
          const msg = error.message.includes('Email not confirmed')
            ? 'Email non confirmé. Désactive la confirmation dans Supabase.'
            : 'Email ou mot de passe incorrect.';
          errEl.textContent = msg;
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Se connecter';
          return;
        }
      } else {
        // Passe pseudo + rôle en métadonnées → le trigger DB crée le profil automatiquement
        const { data: signupData, error } = await _supabase.auth.signUp({
          email, password,
          options: { data: { username, name: username, role: selectedRole } }
        });
        if (error) {
          errEl.textContent = error.message;
          btnSubmit.disabled = false;
          btnSubmit.textContent = "S'inscrire";
          return;
        }
        if (signupData.user) {
          // Upsert en fallback (si la session est dispo, ex: sans confirmation email)
          const { error: profileError } = await _supabase.from('profiles').upsert(
            { user_id: signupData.user.id, username, name: username, photo: '', role: selectedRole, updated_at: new Date().toISOString() },
            { onConflict: 'user_id' }
          );
          if (profileError) {
            if (profileError.code === '23505' || profileError.message?.includes('unique')) {
              errEl.textContent = 'Ce pseudo est déjà pris. Choisis-en un autre.';
              btnSubmit.disabled = false;
              btnSubmit.textContent = "S'inscrire";
              return;
            }
          }
          localStorage.setItem('imaz_profil_username', username);
          localStorage.setItem('imaz_profil_name',     username);
          localStorage.setItem('imaz_profil_role',     selectedRole);
        }
      }

      await loadFromSupabase();
      window.location.href = 'index.html';
    });
  </script>

</body>
</html>
